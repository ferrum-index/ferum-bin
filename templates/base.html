<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ app_name }}{% endblock title %}</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2430;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{% block preheader %}{% endblock preheader %}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:10px;border:1px solid #e3e6ec;">
        <tr><td style="padding:24px 32px 0 32px;font-size:18px;font-weight:700;color:#1f2430;">{{ app_name }}</td></tr>
        <tr><td style="padding:16px 32px 32px 32px;font-size:15px;line-height:1.6;">
          {% block content %}{% endblock content %}
        </td></tr>
      </table>
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
        <tr><td style="padding:16px 32px;font-size:12px;line-height:1.5;color:#7a8190;text-align:center;">
          {% block footer %}You received this email because of activity on your {{ app_name }} account.{% endblock footer %}
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
